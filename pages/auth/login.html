<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - RidePool+</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 350px;
        }
        .logo {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #3B2A60;
        }
        .logo span { color: #D3C5F6; }
        .subtitle {
            text-align: center;
            color: #6C757D;
            margin: 8px 0 24px;
        }
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 4px;
            color: #3B2A60;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #3B2A60;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #2A1A4A; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .error { color: #C92A2A; text-align: center; margin-top: 12px; }
        .success { color: #2B8A3E; text-align: center; margin-top: 12px; }
        .footer { text-align: center; margin-top: 16px; font-size: 14px; color: #6C757D; }
        .footer a { color: #3B2A60; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">Ride<span>Pool</span>+</div>
    <div class="subtitle">Sign in to continue</div>

    <form id="loginForm">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="test@email.com" />

        <label>Password</label>
        <input type="password" id="password" placeholder="password123" />

        <button type="submit" id="loginBtn">Sign In</button>
    </form>

    <div id="message"></div>

    <div class="footer">
        Don't have an account? <a href="passenger-register.html">Sign Up</a>
    </div>
</div>

<script type="module">
    import { login } from '../../assets/js/api.js'

    const form = document.getElementById('loginForm')
    const email = document.getElementById('email')
    const password = document.getElementById('password')
    const btn = document.getElementById('loginBtn')
    const msg = document.getElementById('message')

    form.addEventListener('submit', async function(e) {
        e.preventDefault()
        console.log('🔑 Login submitted')

        const emailVal = email.value.trim()
        const passVal = password.value.trim()

        if (!emailVal || !passVal) {
            msg.innerHTML = '⚠️ Please enter both email and password.'
            msg.style.color = '#E85D04'
            return
        }

        btn.innerHTML = '⏳ Signing in...'
        btn.disabled = true
        msg.innerHTML = ''

        try {
            console.log('📡 Calling login API...')
            const result = await login({ email: emailVal, password: passVal })
            console.log('✅ Login success:', result)

            const role = result.user.role || 'passenger'
            const redirects = {
                'passenger': '../passenger/index.html',
                'driver': '../driver/index.html',
                'admin': '../admin/index.html'
            }

            msg.innerHTML = '✅ Welcome ' + result.user.name + '! Redirecting...'
            msg.style.color = '#2B8A3E'

            // Save user
            localStorage.setItem('user', JSON.stringify(result.user))

            // Redirect after 1 second
            setTimeout(() => {
                console.log('🔀 Redirecting to:', redirects[role])
                window.location.href = redirects[role] || '../landing/index.html'
            }, 1000)

        } catch (error) {
            console.error('❌ Login error:', error)
            msg.innerHTML = '❌ Login failed: ' + error.message
            msg.style.color = '#C92A2A'
            btn.innerHTML = 'Sign In'
            btn.disabled = false
        }
    })
</script>

</body>
</html>
