<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - RidePool+</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="auth.css" />
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-logo">
                <i class="fas fa-car-side"></i>
                <span>Ride<span>Pool</span>+</span>
            </div>

            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Sign in to continue to your dashboard</p>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required />
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Enter your password" required />
                        <button type="button" class="password-toggle" id="passwordToggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" />
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <!-- Role Selection -->
            <div class="role-selector">
                <span class="role-label">Sign in as:</span>
                <div class="role-buttons">
                    <button class="role-btn active" data-role="passenger">
                        <i class="fas fa-user"></i> Passenger
                    </button>
                    <button class="role-btn" data-role="driver">
                        <i class="fas fa-car"></i> Driver
                    </button>
                    <button class="role-btn" data-role="admin">
                        <i class="fas fa-user-tie"></i> Admin
                    </button>
                </div>
            </div>

            <div class="auth-footer">
                <p>Don't have an account? <a href="passenger-register.html">Sign Up</a></p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
